name: "Accessibility"
description: >-
  QASP accessibility check. Contract: a `test:a11y` script must exist in
  package.json. There's no reliable way to auto-detect "this project has no
  UI" across arbitrary codebases, so this action doesn't try — a missing
  script fails loudly instead of silently passing. Projects with no UI
  should still add the script as an explicit, visible no-op (e.g.
  "test:a11y": "echo 'No UI in this project' && exit 0") so the N/A
  determination is a human decision, not an inferred one.
inputs:
  node-version:
    description: "Node version to use (e.g., '26') or a file path (e.g., '.nvmrc')"
    required: false
    default: ".nvmrc"
  command-accessibility:
    description: "Command to run for accessibility testing (default: 'npm run test:accessibility')"
    required: false
    default: "npm run test:accessibility"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - name: Determine Node version
      shell: bash
      run: |
        if [ -f "${{ inputs.node-version }}" ]; then
          NODE_VERSION=$(cat "${{ inputs.node-version }}" | tr -d '[:space:]')
        else
          NODE_VERSION="${{ inputs.node-version }}"
        fi
        echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Detect package manager
      id: package-manager
      shell: bash
      run: bash "${{ github.action_path }}/../../scripts/detect-package-manager.sh"

    - name: Install pnpm
      if: env.PACKAGE_MANAGER == 'pnpm'
      shell: bash
      run: npm install -g pnpm

    - name: Install dependencies
      if: env.PACKAGE_MANAGER != 'none'
      shell: bash
      run: |
        if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
          pnpm install --frozen-lockfile
        else
          npm ci
        fi
    - name: Install Playwright browsers
      shell: bash
      run: npx playwright install --with-deps)

    - name: Run accessibility tests
      shell: bash
      run: ${{ inputs.command-accessibility }}

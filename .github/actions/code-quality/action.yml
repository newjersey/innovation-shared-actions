name: "Code Quality"
description: >-
  QASP code quality check — installs dependencies and lints with warnings
  treated as errors.
inputs:
  node-version:
    description: "Node version to use (e.g., '26') or a file path (e.g., '.nvmrc')"
    required: false
    default: ".nvmrc"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - name: Determine Node version
      shell: bash
      run: |
        if [ -f "${{ inputs.node-version }}" ]; then
          NODE_VERSION=$(cat "${{ inputs.node-version }}" | tr -d '[:space:]')
        else
          NODE_VERSION="${{ inputs.node-version }}"
        fi
        echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Lint
      shell: bash
      run: npm run lint -- --error-on-warnings

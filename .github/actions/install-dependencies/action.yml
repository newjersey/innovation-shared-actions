name: "Install dependencies"
description: >-
  Detects whether a project uses npm or pnpm (based on lockfile) and
  installs dependencies with the matching package manager. Skips
  installation if neither lockfile is found.

outputs:
  package-manager:
    description: "Detected package manager: 'npm', 'pnpm', or 'none' (no lockfile found)"
    value: ${{ steps.detect.outputs.package-manager }}

runs:
  using: "composite"
  steps:
    - name: Detect package manager
      id: detect
      shell: bash
      run: |
        if [ -f pnpm-lock.yaml ]; then
          PACKAGE_MANAGER="pnpm"
        elif [ -f package-lock.json ]; then
          PACKAGE_MANAGER="npm"
        else
          PACKAGE_MANAGER="none"
          echo "No package-lock.json or pnpm-lock.yaml found. Skipping dependency installation."
        fi
        echo "PACKAGE_MANAGER=$PACKAGE_MANAGER" >> "$GITHUB_ENV"
        echo "package-manager=$PACKAGE_MANAGER" >> "$GITHUB_OUTPUT"

    - name: Install pnpm
      if: env.PACKAGE_MANAGER == 'pnpm'
      shell: bash
      run: npm install -g pnpm

    - name: Install dependencies
      if: env.PACKAGE_MANAGER != 'none'
      shell: bash
      run: |
        if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
          pnpm install --frozen-lockfile
        else
          npm ci
        fi

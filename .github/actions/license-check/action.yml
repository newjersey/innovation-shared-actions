name: "License Check"
description: >-
  QASP documentation check for dependency licenses. QASP frames
  "documentation" as a judgment call ("use your judgment to pass/fail"), not
  a hard standard — except licenses, which have a real automated signal:
  does every dependency (including our own packages) resolve to a known
  license? Any OSS license is acceptable here, so this only fails on
  unresolvable/unknown licenses, not on license type. Inline-comment quality
  is skipped entirely as unautomatable.
inputs:
  node-version:
    description: "Node version to use (e.g., '20') or a file path (e.g., '.nvmrc')"
    required: false
    default: ".nvmrc"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - name: Determine Node version
      shell: bash
      run: |
        if [ -f "${{ inputs.node-version }}" ]; then
          NODE_VERSION=$(cat "${{ inputs.node-version }}" | tr -d '[:space:]')
        else
          NODE_VERSION="${{ inputs.node-version }}"
        fi
        echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Generate dependency license report
      shell: bash
      run: |
        npx --yes license-checker-rseidelsohn@5.0.1 --unknown --json --out license-report.json
        {
          echo "### Dependency licenses"
          npx --yes license-checker-rseidelsohn@5.0.1 --unknown --summary
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Fail on unresolvable licenses
      shell: bash
      run: |
        node -e '
          const report = JSON.parse(require("fs").readFileSync("license-report.json", "utf8"));
          const unknown = Object.entries(report).filter(([, info]) => String(info.licenses).toUpperCase().includes("UNKNOWN"));
          if (unknown.length > 0) {
            console.error("::error::Packages with an unresolvable license: " + unknown.map(([pkg]) => pkg).join(", "));
            process.exit(1);
          }
        '

name: "License Check"
description: >-
  QASP documentation check for dependency licenses. QASP frames
  "documentation" as a judgment call ("use your judgment to pass/fail"), not
  a hard standard — except licenses, which have two real automated signals:
  does every dependency (including our own packages) resolve to a known
  license, and is any dependency GPL-family (GPL/LGPL/AGPL) licensed? Any
  other OSS license is acceptable. GPL-family licenses fail because their
  copyleft terms can force this project's own code to be redistributed
  under GPL — AGPL in particular triggers just from running modified code
  as a network service, not only from distributing it. Inline-comment
  quality is skipped entirely as unautomatable.
inputs:
  node-version:
    description: "Node version to use (e.g., '20') or a file path (e.g., '.nvmrc')"
    required: false
    default: ".nvmrc"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
    - name: Determine Node version
      shell: bash
      run: |
        if [ -f "${{ inputs.node-version }}" ]; then
          NODE_VERSION=$(cat "${{ inputs.node-version }}" | tr -d '[:space:]')
        else
          NODE_VERSION="${{ inputs.node-version }}"
        fi
        echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Generate dependency license report
      shell: bash
      run: |
        npx --yes license-checker-rseidelsohn@5.0.1 --json --out license-report.json
        {
          echo "### Dependency licenses"
          npx --yes license-checker-rseidelsohn@5.0.1 --summary
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Fail on unresolvable or GPL-family licenses
      shell: bash
      run: |
        node -e '
          const report = JSON.parse(require("fs").readFileSync("license-report.json", "utf8"));
          const entries = Object.entries(report);
          const unknown = entries.filter(([, info]) => String(info.licenses).toUpperCase().includes("UNKNOWN"));
          const gpl = entries.filter(([, info]) => String(info.licenses).toUpperCase().includes("GPL"));
          if (unknown.length > 0) {
            console.error("::error::Packages with an unresolvable license: " + unknown.map(([pkg]) => pkg).join(", "));
          }
          if (gpl.length > 0) {
            console.error("::error::Packages with a GPL-family license (GPL/LGPL/AGPL): " + gpl.map(([pkg, info]) => pkg + " (" + info.licenses + ")").join(", "));
          }
          if (unknown.length > 0 || gpl.length > 0) {
            process.exit(1);
          }
        '
    - if: ${{ !cancelled() }}
      name: Upload license report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: license-report.json

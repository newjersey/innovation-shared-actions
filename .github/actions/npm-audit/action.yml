name: "npm audit"
description: "Run npm or pnpm audit and fail on vulnerabilities at or above a given severity threshold"
inputs:
  node-version:
    description: "Node version to use (e.g., '26') or a file path (e.g., '.nvmrc')"
    required: false
    default: ".nvmrc"
  audit-level:
    description: "Audit severity threshold"
    required: false
    default: "critical"

outputs:
  audit_status:
    description: "Outcome of the audit: 'success', 'failure', or 'skipped' (no lockfile)"
    value: ${{ steps.audit-status.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Determine Node version
      id: node-version
      shell: bash
      run: |
        if [ -f "${{ inputs.node-version }}" ]; then
          # It's a file, read version from file
          NODE_VERSION=$(cat "${{ inputs.node-version }}" | tr -d '[:space:]')
          echo "Node version read from file: $NODE_VERSION"
        else
          # Treat as literal version
          NODE_VERSION="${{ inputs.node-version }}"
          echo "Node version provided directly: $NODE_VERSION"
        fi
        echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_ENV

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: '' # disable auto-caching because npm vs. pnpm

    - name: Debug action context
      shell: bash
      run: |
        echo "github.action_repository: '${{ github.action_repository }}'"
        echo "github.action_ref: '${{ github.action_ref }}'"
        echo "github.action: '${{ github.action }}'"
        echo "github.action_path: '${{ github.action_path }}'"
        echo "github.repository: '${{ github.repository }}'"

    - name: Checkout install-dependencies action
      uses: actions/checkout@v7
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      with:
        repository: ${{ env.ACTION_REPOSITORY }}
        ref: ${{ env.ACTION_REF }}
        path: .install-dependencies-action
        sparse-checkout: .github/actions/install-dependencies

    - name: Install dependencies
      id: install
      uses: ./.install-dependencies-action/.github/actions/install-dependencies

    - name: Run audit (fail on ${{ inputs.audit-level }})
      id: audit
      if: steps.install.outputs.package-manager != 'none'
      shell: bash
      run: |
        if [ "${{ steps.install.outputs.package-manager }}" = "pnpm" ]; then
          pnpm audit --audit-level=${{ inputs.audit-level }}
        else
          npm audit --audit-level=${{ inputs.audit-level }}
        fi

    - name: Set audit status output
      id: audit-status
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.install.outputs.package-manager }}" = "none" ]; then
          STATUS="skipped"
        elif [ "${{ steps.audit.outcome }}" = "failure" ]; then
          STATUS="failure"
        else
          STATUS="success"
        fi

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

name: "Secret Scanning Alerts"
description: >-
  QASP security check. Any open secret-scanning alert fails — unlike
  vulnerabilities, a leaked credential doesn't have an acceptable
  low-severity tier. The default GITHUB_TOKEN cannot access the
  secret-scanning alerts API regardless of granted permissions — pass a
  personal access token or GitHub App installation token with
  "Secret scanning alerts: read" access instead.
inputs:
  github-token:
    description: "Token with 'Secret scanning alerts: read' access (a PAT or GitHub App installation token) — NOT the default GITHUB_TOKEN, which cannot access this API"
    required: true

runs:
  using: "composite"
  steps:
    - name: Check for open secret-scanning alerts
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        alerts=$(gh api "repos/${{ github.repository }}/secret-scanning/alerts" --jq '[.[] | select(.state == "open")]')
        count=$(printf '%s' "$alerts" | jq 'length')
        printf '%s' "$alerts" | jq -r '.[] | "- " + .secret_type + ": " + .html_url'
        if [ "$count" -gt 0 ]; then
          echo "::error::$count open secret-scanning alert(s) found."
          exit 1
        fi

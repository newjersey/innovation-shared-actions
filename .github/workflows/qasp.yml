name: QASP

on:
  workflow_call:
    inputs:
      deployment-check-urls:
        description: "One URL per line: a staging health-check endpoint, an npm registry URL (unversioned), etc. Only checked for a successful response."
        required: true
        type: string
      system-diagram-location:
        description: "Filepath or URL pointing at the current system diagram. Not checked for reachability — only confirms someone provided a location, not that it's accurate."
        required: true
        type: string
      node-version:
        description: "Node version to use (e.g., '26') or a file path (e.g., '.nvmrc')"
        required: false
        default: ".nvmrc"
        type: string
    secrets:
      OOI_PULL_REQUEST_APP:
        description: "Private key for the GitHub App (app-id 2454947)"
        required: true

jobs:
  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: newjersey/innovation-shared-actions/.github/actions/code-coverage@feat/qasp-shared-workflow
        with:
          node-version: ${{ inputs.node-version }}

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: newjersey/innovation-shared-actions/.github/actions/code-quality@feat/qasp-shared-workflow
        with:
          node-version: ${{ inputs.node-version }}

  accessibility:
    name: Accessibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: newjersey/innovation-shared-actions/.github/actions/accessibility@feat/qasp-shared-workflow
        with:
          node-version: ${{ inputs.node-version }}

  deployment:
    name: Deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: newjersey/innovation-shared-actions/.github/actions/deployment-check@feat/qasp-shared-workflow
        with:
          check-urls: ${{ inputs.deployment-check-urls }}

  documentation:
    name: Documentation checks (needs human review)
    runs-on: ubuntu-latest
    steps:
      - uses: newjersey/innovation-shared-actions/.github/actions/license-check@feat/qasp-shared-workflow
        with:
          node-version: ${{ inputs.node-version }}
      - uses: newjersey/innovation-shared-actions/.github/actions/readme-check@feat/qasp-shared-workflow
      - if: ${{ !cancelled() }}
        uses: newjersey/innovation-shared-actions/.github/actions/system-diagram-check@feat/qasp-shared-workflow
        with:
          diagram-location: ${{ inputs.system-diagram-location }}

  security-alerts:
    name: Security alerts
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub app token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: "2454947"
          private-key: ${{ secrets.OOI_PULL_REQUEST_APP }}
      - uses: newjersey/innovation-shared-actions/.github/actions/code-scanning-alerts@feat/qasp-shared-workflow
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
      - if: ${{ !cancelled() && steps.generate-token.outcome == 'success' }}
        uses: newjersey/innovation-shared-actions/.github/actions/secret-scanning-alerts@feat/qasp-shared-workflow
        with:
          github-token: ${{ steps.generate-token.outputs.token }}

  npm-audit:
    name: Security - npm audit
    uses: ./.github/workflows/npm-audit.yml
    with:
      node-version: ${{ inputs.node-version }}
      audit-level: "high"
